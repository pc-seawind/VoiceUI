node:
  id: linux_xvf3800_wake_aliyun
  room: demo_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 2
  block_ms: 80
  device: "reSpeaker XVF3800 4-Mic Array: USB Audio"
  # On this Linux host, wake-monitor trials show the raw channel gives much
  # stronger openWakeWord scores for "alexa" than the AEC/EC channel.
  wake_stream_channel: 1
  # ch0 is the XVF3800 AEC/EC path and is still used for the real assistant.
  # ch1 is the raw mic channel used only for wake and loopback diagnostics.
  command_stream_channel: 0
  input_gain_db: 0.0
  debug: true

wake:
  engine: openwakeword
  model: alexa
  # Keep production wake less sensitive on the XVF3800 raw channel.  If a room
  # is noisy, tune within 0.45-0.55 instead of dropping back to bring-up levels.
  threshold: 0.5
  trigger_level: 2
  max_wait_seconds: 0
  inference_framework: onnx
  debug: true
  debug_interval_seconds: 1.0
  debug_top_predictions: 6

wake_ack:
  enabled: true
  wav_path: default
  playback_device: "reSpeaker XVF3800 4-Mic Array: USB Audio"
  # Keep the local wake acknowledgement at source level. Room loudness should
  # come from the system/output mixer rather than hot digital gain.
  playback_gain_db: 0.0

vad:
  # Match the Windows production wake config: neural VAD with enough pre-roll
  # to preserve speech that starts immediately after the wake word/ack.
  engine: silero
  threshold: 0.6
  min_speech_ms: 250
  silence_ms: 800
  trailing_silence_trim_ms: 500
  max_speech_ms: 15000
  pre_roll_ms: 640
  frame_ms: 32
  debug: true

stt:
  provider: aliyun_nls
  endpoint: wss://nls-gateway-cn-shanghai.aliyuncs.com/ws/v1
  access_key_id_env: ALIYUN_AccessKeyId
  access_key_secret_env: ALIYUN_AccessKeySecret
  app_key_env: ALIYUN_NLS_APPKEY
  timeout_seconds: 20
  language: zh
  leading_silence_ms: 200
  # Full streaming path: STT session is pre-opened before VAD and PCM frames are
  # pushed synchronously with ready/backpressure gates.
  streaming: true
  debug: true

llm:
  # Real Linux assistant path: wake detection, real ALSA capture, Aliyun STT/TTS,
  # and Bailian LLM. Aliyun uses ALIYUN_NLS_APPKEY, ALIYUN_AccessKeyId, and
  # ALIYUN_AccessKeySecret; the LLM uses BAILIAN_API_KEY.
  provider: bailian
  endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: BAILIAN_API_KEY
  model: qwen3.6-flash
  temperature: 0.5
  stream: true
  extra_body:
    enable_thinking: false
  system_prompt: >
    You are a Chinese smart speaker assistant. Reply in natural spoken Chinese
    with at most 1-2 short sentences. Do not use Markdown, numbered lists, or
    bullet lists. If the input sounds unclear, like background speech, or
    semantically incomplete, ask one brief clarification question instead of
    explaining. Do not claim something is latest, official, or market analysis
    unless a tool result provides it. For routine Xiaomi HomeKit commands,
    execute directly when exactly one device matches. Ask for confirmation only
    when the target is ambiguous or the action is sensitive, such as locks or
    cooking appliances.

tts:
  provider: aliyun_nls
  endpoint: wss://nls-gateway-cn-beijing.aliyuncs.com/ws/v1
  access_key_id_env: ALIYUN_AccessKeyId
  access_key_secret_env: ALIYUN_AccessKeySecret
  app_key_env: ALIYUN_NLS_APPKEY
  timeout_seconds: 20
  # Match the Windows demo voice so Linux and Windows sound consistent.
  voice: longxiaochun
  audio_format: pcm
  sample_rate: 24000
  playback_sample_rate: 16000
  playback_channels: 2
  # Full streaming path: LLM chunks feed stream-input TTS and playback is
  # frame-sized with write/backpressure metrics.
  stream: true
  # Match Windows cloud-side volume. Control room loudness with system volume.
  volume: 50
  speech_rate: 0
  pitch_rate: 0
  playback_device: "reSpeaker XVF3800 4-Mic Array: USB Audio"
  limiter_enabled: true
  limiter_threshold: 0.92

conversation:
  # After a wake word, stay in conversation mode and listen for follow-up
  # speech on the command/AEC channel before returning to wake monitoring.
  follow_up_seconds: 10
  follow_up_max_speech_ms: 10000
  wake_speech_start_timeout_seconds: 8
  max_turns: 12
  max_spoken_reply_chars: 80
  barge_in_enabled: true

home_assistant:
  enabled: false
  url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  default_area: demo_room

tools:
  enabled: true
  max_iterations: 4
  allow_time: true
  allow_weather: true
  default_weather_location: 北京昌平
  allow_volume: true
  allow_music: true
  allow_miot: true
  allow_search: true

music:
  provider: meting
  endpoint: https://meting.mikus.ink/api
  server: netease
  max_results: 5
  playback_device: "reSpeaker XVF3800 4-Mic Array: USB Audio"
  playback_sample_rate: 16000
  playback_channels: 2
  playback_volume: 1.0
  ducking_volume_factor: 0.2
  limiter_enabled: true
  limiter_threshold: 0.92

search:
  provider: auto
  tavily_endpoint: https://api.tavily.com/search
  tavily_api_key_env: TAVILY_API_KEY
  tavily_search_depth: basic
  tavily_topic: general
  baidu_ai_enabled: true
  baidu_ai_endpoint: https://qianfan.baidubce.com/v2/ai_search/chat/completions
  baidu_ai_api_key_env: QIANFAN_API_KEY
  baidu_ai_model: deepseek-v3
  baidu_ai_search_mode: required
  baidu_ai_deep_search: false
  baidu_ai_fallback_to_html: true
  baidu_endpoint: https://www.baidu.com/baidu
  timeout_seconds: 15
  max_results: 5

xiaomi_miot:
  enabled: true
  cloud_server: cn
  token_file: .voiceui/miot_token.json
  cache_dir: .voiceui/miot_cache
  fetch_share_home: false
  auto_refresh: true
  control_verify: true
  control_verify_delay_seconds: 0.8

debug:
  enabled: true
  output_dir: debug_sessions
  save_audio: false
  save_metadata: true
  system_input_dump_enabled: true
  system_input_dump_segment_seconds: 30
  session_scope: run
  voice_path_dump_enabled: true

web:
  enabled: true
  host: 0.0.0.0
  port: 8765

logging:
  enabled: true
  events:
    audio.stream_opened: true
    audio.first_chunk: true
    wake.debug_enabled: false
    wake.detected_debug: true
    vad.debug_start: true
    vad.debug_stop: true
    stt.streaming_config: true
    stt.transcribe_audio: true
    tts.stream_started: true
    tts.first_text_segment: true
    tts.first_text_sent: true
  continuous:
    wake.score: false
    tts.limiter: true
    music.limiter: true
