node:
  id: linux_xvf3800_wake_aliyun
  room: demo_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 2
  block_ms: 80
  device: "reSpeaker XVF3800 4-Mic Array: USB Audio (hw:2,0), ALSA (2 in, 2 out)"
  # On this Linux host, wake-monitor trials show the raw channel gives much
  # stronger openWakeWord scores for "alexa" than the AEC/EC channel.
  wake_stream_channel: 1
  # ch0 is the XVF3800 AEC/EC path and is still used for the real assistant.
  # ch1 is the raw mic channel used only for wake and loopback diagnostics.
  command_stream_channel: 0
  input_gain_db: 0.0
  debug: true

wake:
  engine: openwakeword
  model: alexa
  # Local wake-monitor trials on the XVF3800 raw channel peaked around 0.5 for
  # "alexa", so keep the bring-up threshold lower than the default 0.5.
  threshold: 0.3
  max_wait_seconds: 0
  inference_framework: onnx
  debug: true
  debug_interval_seconds: 1.0
  debug_top_predictions: 6

wake_ack:
  enabled: true
  wav_path: default
  playback_device: "reSpeaker XVF3800 4-Mic Array: USB Audio (hw:2,0), ALSA (2 in, 2 out)"
  playback_gain_db: 12.0

vad:
  engine: energy
  # Service tuning: channel-0 speech during live wake tests was around RMS
  # 2400-4000, so 6000 timed out after wake. Start lower and retune with
  # --calibrate-vad in the final room if false starts appear.
  threshold: 1800.0
  min_speech_ms: 250
  silence_ms: 800
  trailing_silence_trim_ms: 500
  max_speech_ms: 15000
  pre_roll_ms: 240
  frame_ms: 20
  debug: true

stt:
  provider: aliyun_nls
  endpoint: wss://nls-gateway-cn-shanghai.aliyuncs.com/ws/v1
  access_key_id_env: ALIYUN_AccessKeyId
  access_key_secret_env: ALIYUN_AccessKeySecret
  app_key_env: ALIYUN_NLS_APPKEY
  timeout_seconds: 20
  language: zh
  leading_silence_ms: 200
  # Full streaming path: STT session is pre-opened before VAD and PCM frames are
  # pushed synchronously with ready/backpressure gates.
  streaming: true
  debug: true

llm:
  # Real Linux assistant path: wake detection, real ALSA capture, Aliyun STT/TTS,
  # and Bailian LLM. Aliyun uses ALIYUN_NLS_APPKEY, ALIYUN_AccessKeyId, and
  # ALIYUN_AccessKeySecret; the LLM uses BAILIAN_API_KEY.
  provider: bailian
  endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: BAILIAN_API_KEY
  model: qwen3.6-flash
  temperature: 0.5
  stream: true
  extra_body:
    enable_thinking: false
  system_prompt: >
    You are a Chinese smart speaker assistant. Reply in natural spoken Chinese
    with at most 1-2 short sentences. Do not use Markdown, numbered lists, or
    bullet lists. If the input sounds unclear, like background speech, or
    semantically incomplete, ask one brief clarification question instead of
    explaining.

tts:
  provider: aliyun_nls
  endpoint: wss://nls-gateway-cn-beijing.aliyuncs.com/ws/v1
  access_key_id_env: ALIYUN_AccessKeyId
  access_key_secret_env: ALIYUN_AccessKeySecret
  app_key_env: ALIYUN_NLS_APPKEY
  timeout_seconds: 20
  # xiaoyun works reliably with non-streaming NLS and has much higher output
  # level than the longxiaochun stream-input voice on the XVF3800 path.
  voice: xiaoyun
  audio_format: pcm
  sample_rate: 24000
  playback_sample_rate: 16000
  playback_channels: 2
  # Full streaming path: LLM chunks feed stream-input TTS and playback is
  # frame-sized with write/backpressure metrics.
  stream: true
  # Use full cloud-side TTS volume, then control room loudness with system volume.
  volume: 100
  speech_rate: 0
  pitch_rate: 0
  playback_device: "reSpeaker XVF3800 4-Mic Array: USB Audio (hw:2,0), ALSA (2 in, 2 out)"
  # The XVF3800 playback path is much quieter than direct sine-wave tests.
  playback_gain_db: 6.0
  limiter_enabled: true
  limiter_threshold: 0.92

conversation:
  # Disable follow-up while validating the Linux XVF3800 path: the current room
  # can re-trigger VAD from short echo/noise fragments after TTS playback.
  follow_up_seconds: 0
  wake_speech_start_timeout_seconds: 5
  max_turns: 12
  max_spoken_reply_chars: 28
  barge_in_enabled: false

home_assistant:
  enabled: false
  url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  default_area: demo_room

tools:
  enabled: true
  max_iterations: 4
  allow_time: true
  allow_weather: true
  default_weather_location: 北京昌平
  allow_volume: true
  allow_music: false
  allow_miot: false
  allow_search: false

music:
  provider: disabled
  playback_device: "reSpeaker XVF3800 4-Mic Array: USB Audio (hw:2,0), ALSA (2 in, 2 out)"
  playback_sample_rate: 16000
  playback_channels: 2

xiaomi_miot:
  enabled: false
  cloud_server: cn
  token_file: .voiceui/miot_token.json
  cache_dir: .voiceui/miot_cache
  fetch_share_home: false
  auto_refresh: true
  control_verify: true
  control_verify_delay_seconds: 0.8

debug:
  enabled: true
  output_dir: debug_sessions
  save_audio: false
  save_metadata: true
  system_input_dump_enabled: false
  system_input_dump_segment_seconds: 30
  voice_path_dump_enabled: false

logging:
  enabled: true
  events:
    audio.stream_opened: true
    audio.first_chunk: true
    wake.debug_enabled: false
    wake.detected_debug: true
    vad.debug_start: true
    vad.debug_stop: true
    stt.streaming_config: true
    stt.transcribe_audio: true
    tts.stream_started: true
    tts.first_text_segment: true
    tts.first_text_sent: true
  continuous:
    wake.score: false
    tts.limiter: true
