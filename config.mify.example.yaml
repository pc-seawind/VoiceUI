node:
  id: living_room_xvf3800
  room: living_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 2
  block_ms: 80
  device: 24
  wake_stream_channel: 1
  command_stream_channel: 0
  input_gain_db: 0.0

wake:
  engine: openwakeword
  model: hey_jarvis
  threshold: 0.35
  max_wait_seconds: 0
  inference_framework: onnx

wake_ack:
  enabled: true
  wav_path: default
  playback_device: 22

vad:
  engine: silero
  threshold: 0.6
  min_speech_ms: 250
  silence_ms: 800
  max_speech_ms: 15000
  pre_roll_ms: 240
  frame_ms: 32

stt:
  provider: mify
  # MiMo-compatible chat completions base URL. Replace with your Mify endpoint.
  endpoint: https://api.xiaomimimo.com/v1
  api_key_env: MIFY_API_KEY
  timeout_seconds: 60
  model: xiaomi/mimo-v2.5
  language: zh

llm:
  provider: bailian
  endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: BAILIAN_API_KEY
  model: qwen3.6-flash
  temperature: 0.3
  stream: true
  extra_body:
    enable_thinking: false
  system_prompt: >
    You are a concise Chinese home voice assistant. Keep replies short and ask
    for confirmation before sensitive actions.

tts:
  provider: mify
  # MiMo-compatible chat completions base URL. Replace with your Mify endpoint.
  endpoint: https://api.xiaomimimo.com/v1
  api_key_env: MIFY_API_KEY
  timeout_seconds: 60
  model: xiaomi/mimo-v2-tts
  voice: mimo_default
  audio_format: pcm16
  sample_rate: 24000
  playback_sample_rate: 16000
  playback_channels: 2
  style_prompt: 自然、清晰、适合智能音箱的中文播报。
  stream: true
  piper_url: http://localhost:5000
  piper_model: models/voice.onnx
  playback_device: 22

conversation:
  follow_up_seconds: 10
  max_turns: 12

home_assistant:
  enabled: false
  url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  default_area: living_room

debug:
  enabled: true
  output_dir: debug_sessions
  save_audio: true
  save_metadata: true
