node:
  id: living_room_xvf3800
  room: living_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 2
  block_ms: 80
  device: reSpeaker XVF3800
  wake_stream_channel: 1
  command_stream_channel: 0

wake:
  engine: openwakeword
  model: hey_jarvis
  threshold: 0.5
  max_wait_seconds: 0

vad:
  engine: energy
  threshold: 450
  min_speech_ms: 250
  silence_ms: 800
  max_speech_ms: 15000
  pre_roll_ms: 240

stt:
  provider: mify
  # MiMo-compatible chat completions base URL. Replace with your Mify endpoint.
  endpoint: https://api.xiaomimimo.com/v1
  api_key_env: MIFY_API_KEY
  timeout_seconds: 60
  model: mimo-v2.5
  language: zh

llm:
  provider: mify
  # MiMo-compatible chat completions base URL. Replace with your Mify endpoint.
  endpoint: https://api.xiaomimimo.com/v1
  api_key_env: MIFY_API_KEY
  model: mimo-v2.5
  temperature: 0.3
  system_prompt: >
    You are a concise Chinese home voice assistant. Keep replies short and ask
    for confirmation before sensitive actions.

tts:
  provider: mify
  # MiMo-compatible chat completions base URL. Replace with your Mify endpoint.
  endpoint: https://api.xiaomimimo.com/v1
  api_key_env: MIFY_API_KEY
  timeout_seconds: 60
  model: mimo-v2.5-tts
  voice: mimo_default
  audio_format: wav
  style_prompt: 自然、清晰、适合智能音箱的中文播报。
  piper_url: http://localhost:5000
  piper_model: models/voice.onnx
  playback_device: default

conversation:
  follow_up_seconds: 10
  max_turns: 12

home_assistant:
  enabled: false
  url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  default_area: living_room
