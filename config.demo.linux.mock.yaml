node:
  id: linux_xvf3800_mock
  room: demo_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 2
  block_ms: 80
  device: "reSpeaker XVF3800 4-Mic Array: USB Audio"
  wake_stream_channel: 0
  command_stream_channel: 0
  input_gain_db: 0.0

# Linux hardware smoke config: do not require keyboard input or an installed
# wake-word model. `--once` opens the real ALSA device immediately, then VAD
# either records speech or times out according to conversation.wake_speech_start_timeout_seconds.
wake:
  engine: disabled

vad:
  engine: energy
  threshold: 6000.0
  min_speech_ms: 250
  silence_ms: 800
  trailing_silence_trim_ms: 500
  max_speech_ms: 15000
  pre_roll_ms: 240
  frame_ms: 20
  debug: true

stt:
  provider: mock
  mock_text: "你好，Linux 上的真实麦克风链路已经收到语音输入。"

llm:
  provider: mock
  system_prompt: >
    You are a Chinese smart speaker assistant. Reply in natural spoken Chinese
    with at most 1-2 short sentences.

tts:
  provider: console
  playback_device: "reSpeaker XVF3800 4-Mic Array: USB Audio"
  playback_sample_rate: 16000
  playback_channels: 2

conversation:
  follow_up_seconds: 0
  wake_speech_start_timeout_seconds: 3
  max_turns: 1
  barge_in_enabled: false

debug:
  enabled: false
  output_dir: debug_sessions
  save_audio: false
  save_metadata: true
  system_input_dump_enabled: false
  voice_path_dump_enabled: false

logging:
  enabled: true
  events:
    audio.stream_opened: true
    audio.first_chunk: true
    vad.debug_start: true
    vad.debug_stop: true
  continuous: {}
