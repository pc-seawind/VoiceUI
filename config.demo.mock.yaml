node:
  id: first_demo_mock
  room: demo_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 1
  block_ms: 80
  device: 24
  wake_stream_channel: 0
  command_stream_channel: 0
  input_gain_db: 0.0

wake:
  engine: manual

vad:
  engine: silero
  threshold: 0.6
  min_speech_ms: 250
  silence_ms: 800
  max_speech_ms: 15000
  pre_roll_ms: 640
  frame_ms: 32
  debug: true

stt:
  provider: mock
  mock_text: "你好，演示链路已经听到语音输入。"

llm:
  provider: mock
  system_prompt: >
    You are a concise Chinese smart speaker assistant.

tts:
  provider: system

conversation:
  follow_up_seconds: 10
  max_turns: 12

home_assistant:
  enabled: false

debug:
  enabled: true
  output_dir: debug_sessions
  save_audio: true
  save_metadata: true
