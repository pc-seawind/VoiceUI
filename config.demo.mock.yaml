node:
  id: first_demo_mock
  room: demo_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 2
  block_ms: 80
  device: "回音消除话筒 (2- reSpeaker XVF3800 4-Mic Array), Windows WASAPI (2 in, 0 out)"
  wake_stream_channel: 0
  command_stream_channel: 0
  input_gain_db: 0.0

wake:
  engine: manual

vad:
  engine: silero
  threshold: 0.6
  min_speech_ms: 250
  silence_ms: 800
  trailing_silence_trim_ms: 500
  max_speech_ms: 15000
  pre_roll_ms: 640
  frame_ms: 32
  debug: true

stt:
  provider: mock
  mock_text: "你好，演示链路已经听到语音输入。"

llm:
  provider: mock
  system_prompt: >
    You are a Chinese smart speaker assistant. Reply in natural spoken Chinese
    with at most 1-2 short sentences. Do not use Markdown, numbered lists, or
    bullet lists. If the input sounds unclear, like background speech, or
    semantically incomplete, ask one brief clarification question instead of
    explaining.

tts:
  provider: system

conversation:
  follow_up_seconds: 10
  max_turns: 12

home_assistant:
  enabled: false

debug:
  enabled: true
  output_dir: debug_sessions
  save_audio: true
  save_metadata: true
