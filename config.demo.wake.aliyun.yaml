node:
  id: first_wake_demo_aliyun
  room: demo_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 2
  block_ms: 80
  device: "回音消除话筒 (reSpeaker XVF3800 4-Mic Array), Windows WASAPI (2 in, 0 out)"
  wake_stream_channel: 0
  command_stream_channel: 0
  input_gain_db: 0.0
  debug: true

wake:
  engine: openwakeword
  model: alexa
  threshold: 0.5
  max_wait_seconds: 0
  inference_framework: onnx
  debug: true
  debug_interval_seconds: 1.0
  debug_top_predictions: 5

wake_ack:
  enabled: true
  wav_path: default
  playback_device: "回音消除话筒 (reSpeaker XVF3800 4-Mic Array), Windows WASAPI (0 in, 2 out)"

vad:
  engine: silero
  threshold: 0.6
  min_speech_ms: 250
  silence_ms: 800
  trailing_silence_trim_ms: 500
  max_speech_ms: 15000
  pre_roll_ms: 640
  frame_ms: 32
  debug: true

stt:
  provider: aliyun_nls
  endpoint: wss://nls-gateway-cn-shanghai.aliyuncs.com/ws/v1
  access_key_id_env: ALIYUN_AccessKeyId
  access_key_secret_env: ALIYUN_AccessKeySecret
  app_key_env: ALIYUN_NLS_APPKEY
  timeout_seconds: 20
  language: zh
  leading_silence_ms: 200
  debug: true

llm:
  provider: bailian
  endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: BAILIAN_API_KEY
  model: qwen3.6-flash
  temperature: 0.3
  stream: true
  extra_body:
    enable_thinking: false
  system_prompt: >
    You are a concise Chinese smart speaker assistant. Reply in short spoken
    Chinese. Do not include English words unless the user explicitly asks.
    For routine Xiaomi Home light, switch, and curtain commands, execute directly
    when exactly one device matches. Ask for confirmation only when the target is
    ambiguous or the action is sensitive, such as locks or cooking appliances.

tools:
  enabled: true
  max_iterations: 4
  allow_time: true
  allow_weather: true
  default_weather_location: 北京昌平
  allow_volume: true
  allow_music: true
  allow_miot: true
  allow_search: true

music:
  provider: meting
  endpoint: https://meting.mikus.ink/api
  server: netease
  max_results: 5
  playback_device: "回音消除话筒 (reSpeaker XVF3800 4-Mic Array), Windows WASAPI (0 in, 2 out)"
  playback_sample_rate: 16000
  playback_channels: 2
  playback_volume: 1.0
  ducking_volume_factor: 0.2
  limiter_enabled: true
  limiter_threshold: 0.92

search:
  provider: auto
  tavily_endpoint: https://api.tavily.com/search
  tavily_api_key_env: TAVILY_API_KEY
  tavily_search_depth: basic
  tavily_topic: general
  baidu_ai_enabled: true
  baidu_ai_endpoint: https://qianfan.baidubce.com/v2/ai_search/chat/completions
  baidu_ai_api_key_env: QIANFAN_API_KEY
  baidu_ai_model: deepseek-v3
  baidu_ai_search_mode: required
  baidu_ai_deep_search: false
  baidu_ai_fallback_to_html: true
  baidu_endpoint: https://www.baidu.com/baidu
  timeout_seconds: 15
  max_results: 5

xiaomi_miot:
  enabled: true
  cloud_server: cn
  token_file: .voiceui/miot_token.json
  cache_dir: .voiceui/miot_cache
  fetch_share_home: false
  auto_refresh: true
  control_verify: true
  control_verify_delay_seconds: 0.8

tts:
  provider: aliyun_nls
  endpoint: wss://nls-gateway-cn-beijing.aliyuncs.com/ws/v1
  access_key_id_env: ALIYUN_AccessKeyId
  access_key_secret_env: ALIYUN_AccessKeySecret
  app_key_env: ALIYUN_NLS_APPKEY
  timeout_seconds: 20
  voice: longxiaochun
  audio_format: pcm
  sample_rate: 24000
  playback_sample_rate: 16000
  playback_channels: 2
  stream: true
  volume: 50
  speech_rate: 0
  pitch_rate: 0
  playback_device: "回音消除话筒 (reSpeaker XVF3800 4-Mic Array), Windows WASAPI (0 in, 2 out)"
  limiter_enabled: true
  limiter_threshold: 0.92

conversation:
  follow_up_seconds: 10
  max_turns: 12
  barge_in_enabled: true

home_assistant:
  enabled: false
  url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  default_area: demo_room

debug:
  enabled: true
  output_dir: debug_sessions
  save_audio: true
  save_metadata: true
  system_input_dump_enabled: true
  system_input_dump_segment_seconds: 30
  voice_path_dump_enabled: true
