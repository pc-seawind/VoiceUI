node:
  id: living_room_xvf3800
  room: living_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 2
  block_ms: 80
  device: "回音消除话筒 (reSpeaker XVF3800 4-Mic Array), Windows WASAPI (2 in, 0 out)"
  wake_stream_channel: 0
  command_stream_channel: 0
  input_gain_db: 0.0

wake:
  engine: openwakeword
  model: hey_jarvis
  threshold: 0.35
  max_wait_seconds: 0
  inference_framework: onnx

wake_ack:
  enabled: true
  wav_path: default
  playback_device: "回音消除话筒 (reSpeaker XVF3800 4-Mic Array), Windows WASAPI (0 in, 2 out)"

vad:
  engine: silero
  threshold: 0.6
  min_speech_ms: 250
  silence_ms: 800
  trailing_silence_trim_ms: 500
  max_speech_ms: 15000
  pre_roll_ms: 240
  frame_ms: 32

stt:
  provider: faster_whisper
  # Use provider: mify for an OpenAI-compatible /v1/audio/transcriptions backend.
  endpoint: http://localhost:8000/v1/audio/transcriptions
  # api_key_env: MIFY_API_KEY
  timeout_seconds: 60
  model: small
  language: zh
  device: cpu
  compute_type: int8

llm:
  provider: ollama
  # Use provider: bailian for DashScope compatible-mode /v1/chat/completions.
  endpoint: http://localhost:11434
  # api_key_env: BAILIAN_API_KEY
  model: qwen2.5:7b-instruct
  temperature: 0.3
  system_prompt: >
    You are a Chinese smart speaker assistant. Reply in natural spoken Chinese
    with at most 1-2 short sentences. Do not use Markdown, numbered lists, or
    bullet lists. If the input sounds unclear, like background speech, or
    semantically incomplete, ask one brief clarification question instead of
    explaining. Do not claim something is latest, official, or market analysis
    unless a tool result provides it. Ask for confirmation before sensitive
    home actions.

tts:
  provider: console
  sample_rate: 24000
  playback_sample_rate: 16000
  playback_channels: 2
  piper_url: http://localhost:5000
  piper_model: models/voice.onnx
  playback_device: "回音消除话筒 (reSpeaker XVF3800 4-Mic Array), Windows WASAPI (0 in, 2 out)"
  limiter_enabled: true
  limiter_threshold: 0.92

conversation:
  follow_up_seconds: 10
  wake_speech_start_timeout_seconds: 8
  max_turns: 12
  voice_termination_enabled: true
  # Empty means do not speak an acknowledgement before returning to wake listening.
  voice_termination_reply: ""
  voice_termination_phrases:
    - 停
    - 停一下
    - 停止
    - 停止识别
    - 停止语音识别
    - 结束
    - 结束对话
    - 退出
    - 闭嘴
    - 别说了
    - 不要说了
    - 安静
    - 不聊了
    - 不用了
    - 没事了
    - 算了
    - stop
    - exit
    - quit

cron:
  enabled: false
  poll_seconds: 1
  jobs:
    # schedule uses standard 5-field cron: minute hour day-of-month month day-of-week.
    # timezone is optional; leave empty to use the system local timezone.
    - id: morning_weather
      enabled: false
      schedule: "0 7 * * *"
      timezone: ""
      text: "Tell me today's weather."

home_assistant:
  enabled: false
  url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  default_area: living_room

tools:
  enabled: false
  max_iterations: 4
  allow_time: true
  allow_weather: true
  default_weather_location: ""
  allow_volume: false
  allow_music: false
  allow_miot: false
  allow_search: false

music:
  provider: disabled
  endpoint: https://meting.mikus.ink/api
  server: netease
  playback_volume: 1.0
  ducking_volume_factor: 0.2
  limiter_enabled: true
  limiter_threshold: 0.92

search:
  provider: auto
  tavily_endpoint: https://api.tavily.com/search
  tavily_api_key_env: TAVILY_API_KEY
  tavily_search_depth: basic
  tavily_topic: general
  baidu_ai_enabled: true
  baidu_ai_endpoint: https://qianfan.baidubce.com/v2/ai_search/chat/completions
  baidu_ai_api_key_env: QIANFAN_API_KEY
  baidu_ai_model: deepseek-v3
  baidu_ai_search_mode: required
  baidu_ai_deep_search: false
  baidu_ai_fallback_to_html: true
  baidu_endpoint: https://www.baidu.com/baidu
  timeout_seconds: 15
  max_results: 5

xiaomi_miot:
  enabled: false
  cloud_server: cn
  token_file: .voiceui/miot_token.json
  cache_dir: .voiceui/miot_cache
  fetch_share_home: false
  auto_refresh: true
  control_verify: true
  control_verify_delay_seconds: 0.8

debug:
  enabled: false
  output_dir: debug_sessions
  save_audio: true
  save_metadata: true
  system_input_dump_enabled: true
  system_input_dump_segment_seconds: 30
  voice_path_dump_enabled: true

logging:
  enabled: true
  # Event logs are one-off state changes or completed operations. Most are on by default.
  events:
    # Set any log ID from `python -m voiceui --list-log-switches` to false to silence it.
    audio.stream_opened: false
    audio.first_chunk: false
    vad.debug_start: false
    vad.debug_stop: false
    stt.streaming_config: false
    stt.transcribe_audio: false
    tts.first_text_segment: false
    tts.stream_started: false
    tts.first_text_sent: false
  # Continuous logs can repeat during a loop or playback and are off unless explicitly enabled.
  continuous:
    wake.score: false
    tts.limiter: false
    music.limiter: false
