node:
  id: linux_xvf3800_aliyun
  room: demo_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 2
  block_ms: 80
  device: "reSpeaker XVF3800 4-Mic Array: USB Audio"
  wake_stream_channel: 0
  # ch0 is the XVF3800 AEC/EC path and is used for the real assistant.
  # ch1 is the raw mic channel; use it only for loopback diagnostics.
  command_stream_channel: 0
  input_gain_db: 0.0
  debug: true

# Linux production smoke: open the real ALSA microphone immediately, then use
# energy VAD + Aliyun STT/TTS for one real device turn. The LLM stays mocked by
# default so this smoke test does not depend on a Bailian key.
wake:
  engine: disabled

wake_ack:
  enabled: false
  wav_path: default
  playback_device: "reSpeaker XVF3800 4-Mic Array: USB Audio"
  playback_gain_db: 18.0

vad:
  engine: energy
  # Calibrated on the current Ubuntu XVF3800 room-noise run: p95 ~= 4723,
  # recommended threshold ~= 8502. Keep this lower for first live speech tests,
  # then retune with --calibrate-vad in the final deployment room.
  threshold: 6000.0
  min_speech_ms: 250
  silence_ms: 800
  trailing_silence_trim_ms: 500
  max_speech_ms: 15000
  pre_roll_ms: 240
  frame_ms: 20
  debug: true

stt:
  provider: aliyun_nls
  endpoint: wss://nls-gateway-cn-shanghai.aliyuncs.com/ws/v1
  access_key_id_env: ALIYUN_AccessKeyId
  access_key_secret_env: ALIYUN_AccessKeySecret
  app_key_env: ALIYUN_NLS_APPKEY
  timeout_seconds: 20
  language: zh
  leading_silence_ms: 200
  # Full streaming path: STT session is pre-opened before VAD and PCM frames are
  # pushed synchronously with ready/backpressure gates.
  streaming: true
  debug: true

llm:
  # Real Linux assistant path: ALSA capture, Aliyun STT/TTS, and Bailian LLM.
  # Aliyun uses ALIYUN_NLS_APPKEY, ALIYUN_AccessKeyId, and
  # ALIYUN_AccessKeySecret; the LLM uses BAILIAN_API_KEY.
  provider: bailian
  endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: BAILIAN_API_KEY
  model: qwen3.6-flash
  temperature: 0.5
  stream: true
  extra_body:
    enable_thinking: false
  system_prompt: >
    You are a Chinese smart speaker assistant. Reply in natural spoken Chinese
    with at most 1-2 short sentences. Do not use Markdown, numbered lists, or
    bullet lists. If the input sounds unclear, like background speech, or
    semantically incomplete, ask one brief clarification question instead of
    explaining.

tts:
  provider: aliyun_nls
  endpoint: wss://nls-gateway-cn-beijing.aliyuncs.com/ws/v1
  access_key_id_env: ALIYUN_AccessKeyId
  access_key_secret_env: ALIYUN_AccessKeySecret
  app_key_env: ALIYUN_NLS_APPKEY
  timeout_seconds: 20
  # Match the Windows demo voice so Linux and Windows sound consistent.
  voice: longxiaochun
  audio_format: pcm
  sample_rate: 24000
  playback_sample_rate: 16000
  playback_channels: 2
  # Full streaming path: LLM chunks feed stream-input TTS and playback is
  # frame-sized with write/backpressure metrics.
  stream: true
  # Use full cloud-side TTS volume, then control room loudness with system volume.
  volume: 100
  speech_rate: 0
  pitch_rate: 0
  playback_device: "reSpeaker XVF3800 4-Mic Array: USB Audio"
  # The XVF3800 playback path is much quieter than direct sine-wave tests.
  playback_gain_db: 6.0
  limiter_enabled: true
  limiter_threshold: 0.92

conversation:
  follow_up_seconds: 0
  wake_speech_start_timeout_seconds: 8
  max_turns: 1
  barge_in_enabled: false

home_assistant:
  enabled: false
  url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  default_area: demo_room

tools:
  enabled: true
  max_iterations: 4
  allow_time: true
  allow_weather: true
  default_weather_location: 北京昌平
  allow_volume: true
  allow_music: false
  allow_miot: false
  allow_search: false

music:
  provider: disabled
  playback_device: "reSpeaker XVF3800 4-Mic Array: USB Audio"
  playback_sample_rate: 16000
  playback_channels: 2

xiaomi_miot:
  enabled: false
  cloud_server: cn
  token_file: .voiceui/miot_token.json
  cache_dir: .voiceui/miot_cache
  fetch_share_home: false
  auto_refresh: true
  control_verify: true
  control_verify_delay_seconds: 0.8

debug:
  enabled: true
  output_dir: debug_sessions
  save_audio: false
  save_metadata: true
  system_input_dump_enabled: false
  system_input_dump_segment_seconds: 30
  voice_path_dump_enabled: false

logging:
  enabled: true
  events:
    audio.stream_opened: true
    audio.first_chunk: true
    vad.debug_start: true
    vad.debug_stop: true
    stt.streaming_config: true
    stt.transcribe_audio: true
    tts.stream_started: true
    tts.first_text_segment: true
    tts.first_text_sent: true
  continuous:
    tts.limiter: true
