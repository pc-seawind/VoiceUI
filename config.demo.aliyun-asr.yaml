node:
  id: aliyun_asr_demo
  room: demo_room

input:
  mode: audio

audio:
  sample_rate: 16000
  channels: 2
  block_ms: 80
  device: 24
  wake_stream_channel: 1
  command_stream_channel: 0
  input_gain_db: 0.0

wake:
  engine: manual
  model: hey_jarvis
  threshold: 0.5
  max_wait_seconds: 0

vad:
  engine: silero
  threshold: 0.6
  min_speech_ms: 250
  silence_ms: 800
  max_speech_ms: 15000
  pre_roll_ms: 640
  frame_ms: 32
  debug: true

stt:
  provider: aliyun_nls
  endpoint: wss://nls-gateway-cn-shanghai.aliyuncs.com/ws/v1
  access_key_id_env: ALIYUN_AccessKeyId
  access_key_secret_env: ALIYUN_AccessKeySecret
  app_key_env: ALIYUN_NLS_APPKEY
  timeout_seconds: 20
  language: zh
  leading_silence_ms: 200
  debug: true

llm:
  provider: bailian
  endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: BAILIAN_API_KEY
  model: qwen3.6-flash
  temperature: 0.3
  stream: true
  extra_body:
    enable_thinking: false
  system_prompt: >
    You are a concise Chinese smart speaker assistant. Reply in short spoken
    Chinese. Ask for confirmation before sensitive home actions.

tts:
  provider: openai_speech
  endpoint: http://127.0.0.1:8000
  timeout_seconds: 60
  model: tts-1
  voice: default
  audio_format: pcm
  sample_rate: 16000
  stream: true
  playback_device: 22

conversation:
  follow_up_seconds: 10
  max_turns: 12

home_assistant:
  enabled: false
  url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  default_area: demo_room

debug:
  enabled: true
  output_dir: debug_sessions
  save_audio: true
  save_metadata: true
